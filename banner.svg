      <circle cx="21" cy="20" r="5" fill="#e0af68">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="26.5" fill="#c0caf5" font-size="18" font-weight="600">MySQL / MariaDB</text>
    </g>

    <g transform="translate(844 262)">
