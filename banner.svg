      <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0 118 124" to="360 118 124" dur="14s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M84 240 Q84 250 94 250 Q84 250 84 260 Q84 250 74 250 Q84 250 84 240 Z" fill="#e0af68"/>
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0 84 250" to="360 84 250" dur="14s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M446 300 Q446 309 455 309 Q446 309 446 318 Q446 309 437 309 Q446 309 446 300 Z" fill="#7dcfff"/>
      <animate attributeName="opacity" values="1;0.25;1" dur="2.8s" begin="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0 446 309" to="360 446 309" dur="14s" repeatCount="indefinite"/>
    </g>

    <circle cx="150" cy="176" r="4" fill="#bb9af7">
      <animate attributeName="r" values="4;6;4" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
