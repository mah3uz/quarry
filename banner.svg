    <text y="352" clip-path="url(#typed)"><tspan x="476" fill="#bb9af7" textLength="48" lengthAdjust="spacing">\llm</tspan><tspan x="536" fill="#c0caf5" textLength="456" lengthAdjust="spacing">top 10 customers by revenue this month</tspan></text>
