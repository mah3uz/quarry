    <text x="450" y="224" fill="#a9b1d6" font-size="30" font-weight="500">A fast, beautiful SQL client for the terminal</text>
    <g transform="translate(452 262)">
      <rect width="156" height="40" rx="20" fill="#7aa2f7" fill-opacity="0.14" stroke="#7aa2f7" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle cx="21" cy="20" r="5" fill="#7aa2f7">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" begin="0.0s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="26.5" fill="#c0caf5" font-size="18" font-weight="600">PostgreSQL</text>
    </g>

    <g transform="translate(620 262)">
