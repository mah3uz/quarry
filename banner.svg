      <circle cx="21" cy="20" r="5" fill="#7dcfff">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" begin="1.0s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="26.5" fill="#c0caf5" font-size="18" font-weight="600">SQLite</text>
    </g>

    <g transform="translate(967 262)">
      <rect width="156" height="40" rx="20" fill="#bb9af7" fill-opacity="0.14" stroke="#bb9af7" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle cx="21" cy="20" r="5" fill="#bb9af7">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="26.5" fill="#c0caf5" font-size="18" font-weight="600">REPL + TUI</text>
    </g>

    <g transform="translate(1135 262)">
      <rect width="89" height="40" rx="20" fill="#f7768e" fill-opacity="0.14" stroke="#f7768e" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle cx="21" cy="20" r="5" fill="#f7768e">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" begin="2.0s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="26.5" fill="#c0caf5" font-size="18" font-weight="600">Rust</text>
    </g>
  </g>

