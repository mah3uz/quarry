[package]
name = "quarry"
version = "0.1.0"
edition = "2024"
description = "A fast, beautiful SQL client and TUI for PostgreSQL, MySQL / MariaDB and SQLite"
authors = ["Mahfuz Shaikh <mah3uz@gmail.com>"]
license = "MIT"
repository = "https://github.com/mah3uz/quarry"
readme = "README.md"
keywords = ["sql", "postgres", "mysql", "sqlite", "tui"]
categories = ["command-line-utilities", "database"]

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = { version = "~4.6.11", features = ["unstable-dynamic"] }
cliclack = "0.5.6"
crossterm = "0.29.0"
csv = "1.4.0"
dirs = "7.0.0"
futures-util = "0.3.34"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal", "rustls-tls"] }
nu-ansi-term = "0.50"
percent-encoding = "2.3.2"
ratatui = "0.30.2"
reedline = "0.52.0"
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype", "load_extension", "serde_json"] }
rustls = "0.23.45"
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
toml = "1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"
webpki-roots = "1.0.9"
which = "8.0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
