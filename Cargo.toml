[package]
name = "quarry"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
csv = "1.4.0"
dirs = "7.0.0"
futures-util = "0.3.34"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal", "rustls-tls"] }
nucleo-matcher = "0.3.1"
percent-encoding = "2.3.2"
ratatui = "0.30.2"
reedline = "0.52.0"
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype", "load_extension", "serde_json"] }
rustls = "0.23.45"
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
toml = "1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
webpki-roots = "1.0.9"
which = "8.0.6"
